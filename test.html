<!DOCTYPE html>
<html>
<head>
    <title>MCP WebSocket Client</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #chat-container {
            max-width: 600px;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            background-color: #f9f9f9;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 10px;
            max-width: 80%;
            line-height: 1.4;
        }
        .user {
            background-color: #d1e7dd;
            align-self: flex-end;
            text-align: right;
            margin-left: auto;
        }
        .bot {
            background-color: #e2e3e5;
            align-self: flex-start;
            text-align: left;
            margin-right: auto;
        }
        #input-container {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        #question {
            flex: 1;
            padding: 8px;
            font-size: 16px;
        }
        #results {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <h1>MCP WebSocket Chat</h1>
    <div id="chat-container">
        <div id="results"></div>
        <div id="input-container">
            <input type="text" id="question" placeholder="Nhập câu hỏi..." onkeydown="if(event.key === 'Enter') sendQuestion()">
            <button onclick="sendQuestion()">Gửi</button>
        </div>
    </div>

    <script>
        const socket = new WebSocket('ws://localhost:8765');
        let queryId = 1;

        const sendQuery = (question, id) => {
            socket.send(JSON.stringify({
                jsonrpc: '2.0',
                method: 'query_projects',
                params: { question },
                id
            }));
        };

        socket.onmessage = (event) => {
            const response = JSON.parse(event.data);
            const resultsDiv = document.getElementById('results');

            if (response.result) {
                const result = response.result;
                const sqlMessage = document.createElement('div');
                sqlMessage.className = 'message bot';
                sqlMessage.innerHTML = `<strong>SQL:</strong> ${result.sql_query}`;
                resultsDiv.appendChild(sqlMessage);

                const answerMessage = document.createElement('div');
                answerMessage.className = 'message bot';
                answerMessage.innerHTML = `<strong>Trả lời:</strong> ${result.answer}`;
                resultsDiv.appendChild(answerMessage);

                const dataMessage = document.createElement('div');
                dataMessage.className = 'message bot';
                dataMessage.innerHTML = `<strong>Dữ liệu:</strong><pre>${JSON.stringify(result.data, null, 2)}</pre>`;
                resultsDiv.appendChild(dataMessage);
            } else if (response.error) {
                const errorMessage = document.createElement('div');
                errorMessage.className = 'message bot';
                errorMessage.style.color = 'red';
                errorMessage.textContent = `Lỗi: ${response.error.message}`;
                resultsDiv.appendChild(errorMessage);
            }

            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        };

        socket.onerror = (error) => {
            const errorMsg = document.createElement('div');
            errorMsg.className = 'message bot';
            errorMsg.style.color = 'red';
            errorMsg.textContent = 'Lỗi kết nối WebSocket';
            document.getElementById('results').appendChild(errorMsg);
        };

        socket.onclose = () => {
            const closeMsg = document.createElement('div');
            closeMsg.className = 'message bot';
            closeMsg.textContent = 'Đã ngắt kết nối';
            document.getElementById('results').appendChild(closeMsg);
        };

        function sendQuestion() {
            const questionInput = document.getElementById('question');
            const question = questionInput.value.trim();
            const resultsDiv = document.getElementById('results');

            if (question) {
                // Hiển thị tin nhắn người dùng
                const userMessage = document.createElement('div');
                userMessage.className = 'message user';
                userMessage.textContent = question;
                resultsDiv.appendChild(userMessage);

                sendQuery(question, queryId++);
                questionInput.value = '';
                resultsDiv.scrollTop = resultsDiv.scrollHeight;
            } else {
                alert('Vui lòng nhập câu hỏi');
            }
        }
    </script>
</body>
</html>
